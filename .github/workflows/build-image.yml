name: build-image

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: repo
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY@L}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.repo.outputs.image }}
      - name: Trigger Fedora Webhook Deployment
        run: curl -X POST "https://fedora.tail9454e5.ts.net/deploy.sh?token=${{ secrets.FEDORA_WEBHOOK_TOKEN }}&async=true"